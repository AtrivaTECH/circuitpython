name: Build PicUNO RP2040 Firmware

on:
  push:
    branches: [ picuno-support ]
    paths:
      - 'ports/raspberrypi/boards/picuno_rp2040/**'
      - '.github/workflows/build-picuno.yml'
  workflow_dispatch:

jobs:
  build-circuitpython:
    runs-on: ubuntu-latest
    
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        df -h
    
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        fetch-tags: true
    
    - name: Fetch tags from upstream
      run: |
        git remote add upstream https://github.com/adafruit/circuitpython.git || true
        git fetch upstream --tags
        git describe --tags
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install ARM GCC
      run: |
        sudo apt-get update
        wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz
        sudo tar xf arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz -C /opt/
        echo "/opt/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi/bin" >> $GITHUB_PATH
        rm arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    
    - name: Build mpy-cross
      run: make -C mpy-cross
    
    - name: Build PicUNO RP2040 firmware
      run: |
        cd ports/raspberrypi
        make BOARD=picuno_rp2040 -j2
        ls -lh build-picuno_rp2040/
    
    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: circuitpython-picuno-rp2040
        path: ports/raspberrypi/build-picuno_rp2040/firmware.uf2
        if-no-files-found: error
